         <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Te amo Yordy &lt;3</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: #000;
  }
  #audio-hint {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #7fb3ff;
    font-family: Arial, sans-serif;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="audio-hint">▶ Click para activar la música</div>
<canvas id="scene"></canvas>
<audio id="bgm" src="love_you.mp3" loop></audio>

<script>
(() => {
  // ---------- Configuración ----------
  const WIDTH = 2000;
  const HEIGHT = 1200;
  const BACKGROUND_COLOR = "#000000";
  const FPS = 60;
  const SCALE = 20;

  // Palabras flotantes (en español, variaciones)
  const WORDS = ["te amo", "Te Amo", "TE AMO"];
  const CENTER_TEXT = " Te amo Yordy ";
  const COLORS = [
    [70, 130, 180],
    [30, 144, 255],
    [0, 191, 255],
    [100, 149, 237],
    [65, 105, 225],
  ];

  // ---------- Canvas ----------
  const canvas = document.getElementById("scene");
  canvas.width = WIDTH;
  canvas.height = HEIGHT;
  const ctx = canvas.getContext("2d");

  function fitCanvas() {
    const ratio = WIDTH / HEIGHT;
    const w = window.innerWidth;
    const h = window.innerHeight;
    let cw = w, ch = w / ratio;
    if (ch > h) { ch = h; cw = h * ratio; }
    canvas.style.width = cw + "px";
    canvas.style.height = ch + "px";
  }
  window.addEventListener("resize", fitCanvas);
  fitCanvas();

  // ---------- Audio ----------
  const bgm = document.getElementById("bgm");
  const hint = document.getElementById("audio-hint");
  let audioStarted = false;
  function startAudio() {
    if (audioStarted) return;
    audioStarted = true;
    hint.style.display = "none";
    bgm.volume = 0.6;
    bgm.play().catch(err => console.warn("Audio error:", err));
  }
  hint.addEventListener("click", startAudio);
  window.addEventListener("keydown", startAudio, { once: true });

  // ---------- Matemática del corazón ----------
  function heartXY(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [x, -y];
  }
  function toScreen(x, y) {
    return [x * SCALE + WIDTH / 2, y * SCALE + HEIGHT / 2];
  }

  // ---------- Construcción de partículas ----------
  class Particle {
    constructor(x, y, order, kind) {
      this.x = x;
      this.y = y;
      this.order = order;
      this.kind = kind;
      this.word = WORDS[(Math.random() * WORDS.length) | 0];
      this.color = COLORS[(Math.random() * COLORS.length) | 0];
      this.alpha = 0;
      this.flicker = Math.random() * Math.PI * 2;
      this.delay = 0;
      this.sizeMult = 0.85 + Math.random() * 0.30;
    }
  }

  function buildOutlineParticles(nOutline, minGap = 30) {
    const particles = [];
    const placed = [];
    for (let i = 0; i < nOutline; i++) {
      const t = (i / nOutline) * 2 * Math.PI;
      const [bx, by] = heartXY(t);
      const [sx, sy] = toScreen(bx, by);
      let ok = true;
      for (const [px, py] of placed) {
        if (Math.hypot(sx - px, sy - py) < minGap) { ok = false; break; }
      }
      if (!ok) continue;
      placed.push([sx, sy]);
      particles.push(new Particle(sx, sy, i, "outline"));
    }
    return particles;
  }

  function buildFillParticles(nFill, minGap = 46) {
    const particles = [];
    const placed = [];
    let attempts = 0;
    const maxAttempts = nFill * 80;
    while (particles.length < nFill && attempts < maxAttempts) {
      attempts++;
      const t = Math.random() * 2 * Math.PI;
      const r = Math.random() * 0.86;
      const [bx, by] = heartXY(t);
      const [sx, sy] = toScreen(bx * r, by * r);
      let ok = true;
      for (const [qx, qy] of placed) {
        if (Math.hypot(sx - qx, sy - qy) < minGap) { ok = false; break; }
      }
      if (!ok) continue;
      placed.push([sx, sy]);
      particles.push(new Particle(sx, sy, (Math.random() * 321) | 0, "fill"));
    }
    return particles;
  }

  const outline = buildOutlineParticles(160);
  const fill = buildFillParticles(130);

  const outlineSpan = outline.length ? Math.max(...outline.map(p => p.order)) : 0;
  const framesPerStep = 1.6;
  const fillStartFrame = Math.floor(outlineSpan * framesPerStep) + 30;

  for (const p of fill) p.delay = fillStartFrame + p.order;
  for (const p of outline) p.delay = Math.floor(p.order * framesPerStep);

  const particles = outline.concat(fill);

  function fontFor(p) {
    if (p.kind === "outline") return `bold ${Math.round(20 * p.sizeMult)}px Arial`;
    return `bold ${Math.round(17 * p.sizeMult)}px Arial`;
  }

  // ---------- Dibujo con glow ----------
  function drawGlowText(p, alpha) {
    if (alpha <= 0) return;
    const [r, g, b] = p.color;
    const colorStr = `rgb(${r},${g},${b})`;
    const glowStr = `rgba(${r},${g},${b},1)`;

    ctx.save();
    ctx.font = fontFor(p);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.globalAlpha = Math.min(1, (alpha / 255) * 0.55);
    ctx.shadowColor = glowStr;
    ctx.shadowBlur = 24;
    ctx.fillStyle = colorStr;
    ctx.fillText(p.word, p.x, p.y);

    ctx.globalAlpha = Math.min(1, (alpha / 255) * 0.85);
    ctx.shadowBlur = 10;
    ctx.fillText(p.word, p.x, p.y);

    ctx.globalAlpha = alpha / 255;
    ctx.shadowBlur = 0;
    ctx.fillStyle = colorStr;
    ctx.fillText(p.word, p.x, p.y);

    ctx.restore();
  }

  // ---------- Loop ----------
  let frame = 0;
  let lastTime = performance.now();
  let acc = 0;
  const frameInterval = 1000 / FPS;

  // Fuente del texto central (más grande para que "Te amo Yordy" luzca bien)
  const centerFont = "bold 64px Georgia, serif";
  const centerColor = "rgb(255,250,245)";

  function loop(now) {
    const dt = now - lastTime;
    lastTime = now;
    acc += dt;
    if (acc < frameInterval) {
      requestAnimationFrame(loop);
      return;
    }
    acc = 0;
    frame++;

    // Fondo
    ctx.globalAlpha = 1;
    ctx.fillStyle = BACKGROUND_COLOR;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Partículas
    for (const p of particles) {
      if (frame > p.delay && p.alpha < 255) {
        p.alpha = Math.min(255, p.alpha + 14 + ((Math.random() * 5) | 0));
      }
      let flick = 1.0;
      if (p.alpha >= 255) {
        flick = 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker);
      }
      const alpha = Math.round(p.alpha * flick);
      if (alpha <= 0) continue;
      drawGlowText(p, alpha);
    }

    // Texto central
    const centerStart = fillStartFrame + 200;
    if (frame > centerStart) {
      const progress = Math.min(1.0, (frame - centerStart) / 60);
      const centerAlpha = 255 * (1 - Math.exp(-progress * 8));
      const pulse = 1.0 + 0.025 * Math.sin(frame * 0.05);

      ctx.save();
      ctx.translate(WIDTH / 2, HEIGHT / 2);
      ctx.scale(pulse, pulse);
      ctx.font = centerFont;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // Glow
      ctx.globalAlpha = (centerAlpha / 255) * 0.35;
      ctx.shadowColor = centerColor;
      ctx.shadowBlur = 30;
      ctx.fillStyle = centerColor;
      ctx.fillText(CENTER_TEXT, 0, 0);

      // Texto
      ctx.globalAlpha = centerAlpha / 255;
      ctx.shadowBlur = 0;
      ctx.fillStyle = centerColor;
      ctx.fillText(CENTER_TEXT, 0, 0);
      ctx.restore();
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
